[project]
name = "petrilab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "networkx>=3.7",
    "numpy>=2.5.3",
    "pm4py>=2.7.23.8",
    "python-statemachine>=3.2.1",
    "scipy>=1.18.1",
    "sismic>=1.6.13",
    "snakes>=0.9.33",
    "sympy>=1.14.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "automata-lib>=9.2.0",
    "hypothesis>=6.168.3",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "mypy>=2.4.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "transitions>=0.9.3",
    "types-networkx>=3.6.1.20260911",
]

[[tool.mypy.overrides]]
module = ["sismic.*", "snakes.*", "pm4py.*", "sympy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::PendingDeprecationWarning:numpy.*",
    "ignore::DeprecationWarning:pm4py.*",
    "ignore::UserWarning:pm4py.*",
]
