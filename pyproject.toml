[project]
name = "petrilab"
version = "0.1.0"
description = "Petri nets in Python, FSMs designed and verified in XState (see fsm/xstate/)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "networkx>=3.7",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "snakes>=0.9.33",
    "sympy>=1.14.0",
]

[project.optional-dependencies]
# PM4Py is AGPL v3; only needed for the soundness cross-check (is_sound_pm4py).
soundness = ["pm4py>=2.7.23.8"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "mypy>=2.4.0",
    "nbformat>=5.11.1",
    "pm4py>=2.7.23.8",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-networkx>=3.6.1.20260911",
]

[[tool.mypy.overrides]]
module = ["snakes.*", "pm4py.*", "sympy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::PendingDeprecationWarning:numpy.*",
    "ignore::DeprecationWarning:pm4py.*",
    "ignore::UserWarning:pm4py.*",
]
