name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  coherence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Lockfile matches pyproject
        run: uv lock --check
      - name: Docs links, indexes and fences
        run: uv run python scripts/check_docs.py
      - name: Spikes still run
        run: |
          uv sync --locked
          for f in spikes/*/spike_*.py; do uv run python "$f" > /dev/null; done

  mermaid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render every Mermaid block (fails on syntax errors)
        run: |
          mkdir -p "$RUNNER_TEMP/mm"
          for f in docs/*/*.md; do
            grep -q '```mermaid' "$f" || continue
            npx -y @mermaid-js/mermaid-cli -p .github/puppeteer.json -i "$f" -o "$RUNNER_TEMP/mm/$(basename "$f")"
          done
