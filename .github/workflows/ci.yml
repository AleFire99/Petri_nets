name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  coherence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Lockfile matches pyproject
        run: uv lock --check
      - name: Docs links, indexes and fences
        run: uv run python scripts/check_docs.py
      - name: Spikes still run
        run: |
          uv sync --locked
          for f in spikes/*/spike_*.py; do uv run python "$f" > /dev/null; done

  xstate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xstate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: xstate/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Generated files are up to date (pytest reads them)
        run: |
          npm run export
          git diff --exit-code -- generated/ || { echo "::error::run 'npm run export' in xstate/ and commit generated/"; exit 1; }
          test -z "$(git status --porcelain -- generated/)" || { echo "::error::untracked files in xstate/generated/"; exit 1; }
      - name: Exhaustive analysis (deadlock, blocking, invariants, reachability)
        run: npm run analyze
      - run: npm test

  mermaid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Render every Mermaid block (fails on syntax errors)
        run: |
          mkdir -p "$RUNNER_TEMP/mm"
          for f in docs/*/*.md; do
            grep -q '```mermaid' "$f" || continue
            npx -y @mermaid-js/mermaid-cli -p .github/puppeteer.json -i "$f" -o "$RUNNER_TEMP/mm/$(basename "$f")"
          done
